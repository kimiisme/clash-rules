# Quantumult X 示例片段
# 复制到你的配置；策略名需与下方一致，或用 force-policy 覆盖

[policy]
static=PROXY, proxy-name-1, proxy-name-2, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
static=TRADING, proxy-name-1, proxy-name-2, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Stock.png
static=REJECT, reject, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png

