# Clash Meta / Mihomo 示例片段
# 把下面内容合并进你的配置，或参考订阅 URL 自行填写

# ---------- DNS（可选，按需） ----------
# dns:
#   enable: true
#   enhanced-mode: fake-ip
#   nameserver:
#     - 223.5.5.5
#     - 119.29.29.29

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      # - 你的机场节点...

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      # - 你的机场节点...

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 🚀 节点选择

  - name: 🤖 AI
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 📲 Telegram
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🍎 Apple
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🔍 Google
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: TRADING
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT
      # - 建议选低延迟、稳定的节点（美股交易）

# 订阅地址（推送后替换为你的 raw URL）
# 格式: https://raw.githubusercontent.com/<用户名>/<仓库>/main/rules/<文件>.txt
rule-providers:
  private:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/kimiisme/clash-rules/main/rules/private.txt"
    path: ./ruleset/private.txt
    interval: 86400

